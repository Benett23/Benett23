<style>
:root {
  --blue:#1F497D; --blue-l:#4472C4; --blue-pale:#EBF3FB;
  --green:#107c10; --green-bg:#dff0d8;
  --orange:#c07020; --orange-bg:#fff3cd;
  --red:#c00; --red-bg:#fce4d6;
  --purple:#6a0dad; --purple-bg:#f0e6ff;
  --grey:#6e6e73; --border:#e5e5ea;
  --card:#fff; --page:#f2f2f7; --text:#1c1c1e; --text2:#48484a;
  --safe-top:env(safe-area-inset-top,0px);
  --safe-bottom:env(safe-area-inset-bottom,20px);
}
@media(prefers-color-scheme:dark){:root{
  --card:#1c1c1e; --page:#000; --text:#fff; --text2:#aeaeb2;
  --border:#38383a; --blue-pale:#0a2040;
  --green-bg:#0a2a0a; --orange-bg:#2a1800; --red-bg:#2a0000; --purple-bg:#1a0a2a;
}}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{min-height:100%;background:var(--page);color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;font-size:15px}

/* ── Header ── */
.header{background:var(--blue);color:#fff;padding:calc(var(--safe-top)+14px) 16px 0;
  position:sticky;top:0;z-index:50}
.header-row{display:flex;align-items:center;gap:10px;padding-bottom:12px}
.header h1{font-size:1.1em;font-weight:700;flex:1}
.sync-btn{background:rgba(255,255,255,.2);border:none;color:#fff;
  padding:7px 13px;border-radius:12px;font-size:.82em;font-weight:600;cursor:pointer}

/* ── Search + filter bar ── */
.toolbar{background:var(--card);border-bottom:1px solid var(--border);
  padding:10px 16px;display:flex;gap:8px;align-items:center;position:sticky;top:62px;z-index:40}
.search-wrap{flex:1;position:relative}
.search-wrap input{width:100%;padding:8px 12px 8px 32px;border:1.5px solid var(--border);
  border-radius:10px;font-size:.88em;background:var(--page);color:var(--text);outline:none}
.search-wrap input:focus{border-color:var(--blue)}
.si{position:absolute;left:9px;top:50%;transform:translateY(-50%);opacity:.5;pointer-events:none}
.filter-sel{padding:8px 12px;border:1.5px solid var(--border);border-radius:10px;
  font-size:.82em;background:var(--page);color:var(--text);cursor:pointer;outline:none}

/* ── Compteur ── */
.counter{padding:8px 16px;font-size:.8em;color:var(--grey);background:var(--page)}

/* ── Groupe formation ── */
.group{margin-bottom:2px}
.group-header{display:flex;align-items:center;gap:10px;
  padding:12px 16px;background:var(--card);border-bottom:1px solid var(--border);
  cursor:pointer;user-select:none;-webkit-user-select:none}
.group-header:active{background:var(--blue-pale)}
.group-prio{width:26px;height:26px;border-radius:8px;background:var(--blue);
  color:#fff;display:flex;align-items:center;justify-content:center;
  font-size:.75em;font-weight:700;flex-shrink:0}
.group-title{flex:1;font-size:.92em;font-weight:700}
.group-sub{font-size:.75em;color:var(--grey);font-weight:400}
.group-count{font-size:.78em;font-weight:700;color:var(--grey)}
.group-arrow{font-size:.8em;color:var(--grey);transition:transform .2s}
.group.collapsed .group-arrow{transform:rotate(-90deg)}

/* ── Tableau ── */
.table-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch}
table{width:100%;border-collapse:collapse;min-width:520px}
thead th{padding:8px 12px;font-size:.75em;font-weight:700;color:var(--grey);
  text-align:left;background:var(--page);border-bottom:2px solid var(--border);
  white-space:nowrap}
thead th:first-child{width:44px;text-align:center}
tbody tr{border-bottom:1px solid var(--border);cursor:pointer;transition:background .1s}
tbody tr:active,tbody tr:hover{background:var(--blue-pale)}
tbody tr.done{opacity:.6}
td{padding:11px 12px;font-size:.85em;vertical-align:middle}
td:first-child{text-align:center;width:44px}

/* Checkbox custom */
.cb{width:22px;height:22px;border-radius:7px;border:2px solid var(--border);
  display:flex;align-items:center;justify-content:center;
  cursor:pointer;transition:all .15s;flex-shrink:0;margin:auto}
.cb.checked{background:var(--green);border-color:var(--green);color:#fff;font-size:13px}

.etab-name{font-weight:700;line-height:1.3}
.etab-univ{font-size:.77em;color:var(--grey);margin-top:1px}
.loc{display:flex;align-items:center;gap:4px;white-space:nowrap}
.loc-icon{opacity:.5;font-size:.9em}
.tel{white-space:nowrap;color:var(--blue);text-decoration:none;font-weight:500}
.tel:active{opacity:.7}
.date-chip{display:inline-block;padding:3px 8px;border-radius:8px;
  font-size:.75em;font-weight:700;white-space:nowrap}
.date-urgente{background:var(--red-bg);color:var(--red)}
.date-proche{background:var(--orange-bg);color:var(--orange)}
.date-ok{background:var(--green-bg);color:var(--green)}

/* Status badge */
.badge{display:inline-block;padding:3px 9px;border-radius:9px;
  font-size:.75em;font-weight:700;white-space:nowrap}
.b-todo{background:#e5e5ea;color:#555}
.b-brouillon{background:var(--orange-bg);color:var(--orange)}
.b-contacte{background:#d0f0ff;color:#006699}
.b-attente{background:var(--purple-bg);color:var(--purple)}
.b-reponse{background:var(--green-bg);color:var(--green)}
.b-admis{background:#c6efce;color:#276221}
.b-refuse{background:var(--red-bg);color:var(--red)}
.b-depose{background:#d0f0ff;color:#005588}

.actions{display:flex;gap:6px;align-items:center}
.act-btn{padding:5px 10px;border-radius:8px;border:none;font-size:.75em;
  font-weight:700;cursor:pointer;white-space:nowrap}
.act-email{background:var(--blue-pale);color:var(--blue)}
.act-tel{background:var(--green-bg);color:var(--green)}

/* groupe collapsed */
.group.collapsed .table-wrap{display:none}

/* ── Bottom sheet ── */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:200;
  display:none;align-items:flex-end}
.overlay.open{display:flex;animation:fi .2s}
@keyframes fi{from{opacity:0}to{opacity:1}}
.sheet{background:var(--card);border-radius:22px 22px 0 0;width:100%;
  max-height:85vh;overflow-y:auto;animation:su .25s ease}
@keyframes su{from{transform:translateY(100%)}to{transform:translateY(0)}}
.sh-handle{width:38px;height:4px;background:var(--border);border-radius:2px;margin:10px auto 0}
.sh-head{padding:14px 20px 14px;border-bottom:1px solid var(--border)}
.sh-name{font-size:1em;font-weight:700}
.sh-sub{font-size:.82em;color:var(--grey);margin-top:3px}
.sh-body{padding:16px 20px}
.sh-label{font-size:.8em;font-weight:700;color:var(--grey);
  text-transform:uppercase;letter-spacing:.05em;margin:14px 0 8px}
.sh-label:first-child{margin-top:0}
.sh-info{display:flex;flex-direction:column;gap:8px;margin-bottom:2px}
.sh-row{display:flex;align-items:center;gap:10px;font-size:.88em}
.sh-row a{color:var(--blue);font-weight:600;text-decoration:none}
.status-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:16px}
.so{padding:10px;border-radius:12px;border:2px solid var(--border);
  text-align:center;font-size:.82em;font-weight:600;cursor:pointer;transition:all .15s}
.so.sel{border-color:var(--blue);background:var(--blue-pale);color:var(--blue)}
textarea.notes{width:100%;padding:12px;border:1.5px solid var(--border);
  border-radius:12px;font-size:.9em;font-family:inherit;background:var(--page);
  color:var(--text);resize:none;min-height:80px;outline:none;margin-bottom:14px}
textarea.notes:focus{border-color:var(--blue)}
.save-btn{width:100%;padding:14px;background:var(--blue);color:#fff;border:none;
  border-radius:14px;font-size:1em;font-weight:700;cursor:pointer}
.save-btn:active{opacity:.85}

/* ── Toast ── */
.toast{position:fixed;bottom:calc(var(--safe-bottom)+78px);left:50%;
  transform:translateX(-50%) translateY(10px);background:#222;color:#fff;
  padding:9px 18px;border-radius:12px;font-size:.84em;font-weight:500;
  z-index:300;opacity:0;transition:all .2s;pointer-events:none;white-space:nowrap}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

/* ── Bottom nav ── */
.bottom-nav{position:fixed;bottom:0;left:0;right:0;background:var(--card);
  border-top:1px solid var(--border);display:flex;padding:0 0 var(--safe-bottom);
  z-index:100;backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px)}
.nav-item{flex:1;display:flex;flex-direction:column;align-items:center;
  padding:10px 4px 6px;text-decoration:none;color:var(--grey);
  font-size:.65em;font-weight:500;gap:3px}
.nav-item.active{color:var(--blue)}
.nav-icon{font-size:1.55em}

/* ── Empty / loading ── */
.loading{text-align:center;padding:60px 20px;color:var(--grey)}
.spinner{width:34px;height:34px;border:3px solid var(--border);
  border-top-color:var(--blue);border-radius:50%;
  animation:sp .7s linear infinite;margin:0 auto 12px}
@keyframes sp{to{transform:rotate(360deg)}}
.empty{text-align:center;padding:40px 20px;color:var(--grey);font-size:.9em}

.scroll-content{padding-bottom:calc(var(--safe-bottom)+72px)}
</style>
</head>

// Noms complets des formations
const FORM_LABELS = {
  lpaii:         {nom:'LP Automatismes et Informatique Industrielle', short:'LP AII', emoji:'⚙️'},
  sarii:         {nom:'LP SARII — Systèmes Automatisés, Réseaux et Informatique Industrielle', short:'LP SARII', emoji:'📡'},

};

const BADGE_CLASS = {
  'À contacter':'b-todo','Brouillon prêt':'b-brouillon','Contacté':'b-contacte',
  'En attente':'b-attente','Réponse reçue':'b-reponse','Dossier déposé':'b-depose',
  'Admis':'b-admis','Refusé':'b-refuse',
};

let toutesEcoles = [];
let ecoleActive  = null;

// ── Chargement ─────────────────────────────────────────────────────────────────
async function chargerDonnees() {
  try {
    const { data, error } = await sb.from('schools_tracking').select('*').order('formation_priorite').order('etablissement');
    if (!error && data && data.length > 0) {
      // Fusionner avec téléphones du DATA_LOCAL (Supabase n'a pas le tel)
      toutesEcoles = data.map(e => {
        const local = DATA_LOCAL.find(l => l.id === e.id || l.etablissement === e.etablissement && l.formation_id === e.formation_id);
        return { ...e, telephone: e.telephone || (local && local.telephone) || '' };
      });
      localStorage.setItem('ptp_ecoles_cache', JSON.stringify({ecoles: toutesEcoles, ts: Date.now()}));
    } else {
      throw new Error('no data');
    }
  } catch {
    // Fallback cache puis data locale
    const cached = localStorage.getItem('ptp_ecoles_cache');
    if (cached) {
      toutesEcoles = JSON.parse(cached).ecoles;
    } else {
      toutesEcoles = DATA_LOCAL;
    }
  }

  // Fusionner mises à jour locales
  const lu = JSON.parse(localStorage.getItem('ptp_local_updates') || '{}');
  toutesEcoles = toutesEcoles.map(e => ({...e, ...(lu[e.id] || {})}));

  document.getElementById('loading').style.display = 'none';
  filtrer();
}

// ── Filtre ─────────────────────────────────────────────────────────────────────
function filtrer() {
  const q  = document.getElementById('search').value.toLowerCase();
  const st = document.getElementById('filtre-statut').value;

  const filtered = toutesEcoles.filter(e => {
    const mq = !q || e.etablissement.toLowerCase().includes(q) || e.ville.toLowerCase().includes(q)
             || (e.formation||'').toLowerCase().includes(q) || (e.telephone||'').includes(q);
    const ms = st === 'all' || e.statut === st;
    return mq && ms;
  });

  afficher(filtered);
}

// ── Rendu ──────────────────────────────────────────────────────────────────────
function afficher(ecoles) {
  const content = document.getElementById('content');
  const empty   = document.getElementById('empty');

  if (ecoles.length === 0) {
    content.style.display = 'none'; empty.style.display = 'block'; return;
  }
  empty.style.display = 'none'; content.style.display = 'block';

  // Grouper par formation_id, ordonné par priorité
  const groupes = {};
  ecoles.forEach(e => {
    const fid = e.formation_id || 'autre';
    if (!groupes[fid]) groupes[fid] = {priorite: e.formation_priorite || 99, ecoles: []};
    groupes[fid].ecoles.push(e);
  });
  const ordonnes = Object.entries(groupes).sort((a,b) => a[1].priorite - b[1].priorite);

  content.innerHTML = ordonnes.map(([fid, g]) => {
    const fl   = FORM_LABELS[fid] || {nom: fid, short: fid, emoji:'🏫'};
    const nbOk = g.ecoles.filter(e => ['Contacté','En attente','Réponse reçue','Dossier déposé','Admis'].includes(e.statut)).length;

    const lignes = g.ecoles.map(e => {
      const statut   = e.statut || 'À contacter';
      const bClass   = BADGE_CLASS[statut] || 'b-todo';
      const checked  = ['Contacté','En attente','Réponse reçue','Dossier déposé','Admis'].includes(statut);
      const dateClass= dateCssClass(e.date_limite);
      const tel      = e.telephone || '';
      const encoded  = encodeURIComponent(JSON.stringify(e));

      return `<tr class="${checked ? 'done' : ''}" onclick="ouvrirSheet('${encoded}')">
        <td><div class="cb ${checked ? 'checked' : ''}" onclick="event.stopPropagation();toggleCheck('${e.id}','${statut}')" title="Marquer comme contacté">${checked ? '✓' : ''}</div></td>
        <td>
          <div class="etab-name">${e.etablissement}</div>
          <div class="etab-univ">${e.universite || e.region || ''}</div>
        </td>
        <td><div class="loc"><span class="loc-icon">📍</span>${e.ville}</div><div style="font-size:.75em;color:var(--grey);margin-top:2px">${e.region || ''}</div></td>
        <td>${tel ? `<a class="tel" href="tel:${tel.replace(/\s/g,'')}" onclick="event.stopPropagation()">${tel}</a>` : '<span style="color:var(--grey);font-size:.8em">—</span>'}</td>
        <td><span class="date-chip ${dateClass}">${e.date_limite || '—'}</span></td>
        <td><span class="badge ${bClass}">${statut}</span></td>
        <td><div class="actions">
          ${e.email_contact ? `<a class="act-btn act-email" href="mailto:${e.email_contact}?subject=Candidature%20LP%20PTP%20sept.%202026" onclick="event.stopPropagation()">✉️</a>` : ''}
          ${tel ? `<a class="act-btn act-tel" href="tel:${tel.replace(/\s/g,'')}" onclick="event.stopPropagation()">📞</a>` : ''}
        </div></td>
      </tr>`;
    }).join('');

    return `<div class="group" id="grp-${fid}">
      <div class="group-header" onclick="toggleGroupe('${fid}')">
        <div class="group-prio">${g.priorite}</div>
        <div style="flex:1;min-width:0">
          <div class="group-title">${fl.emoji} ${fl.short}</div>
          <div class="group-sub">${fl.nom}</div>
        </div>
        <div class="group-count">${nbOk}/${g.ecoles.length}</div>
        <div class="group-arrow">▾</div>
      </div>
      <div class="table-wrap">
        <table>
          <thead><tr>
            <th title="Contacté ?">✓</th>
            <th>Établissement</th>
            <th>Localisation</th>
            <th>Téléphone</th>
            <th>Date limite</th>
            <th>Statut</th>
            <th>Actions</th>
          </tr></thead>
          <tbody>${lignes}</tbody>
        </table>
      </div>
    </div>`;
  }).join('');
}

function dateCssClass(dl) {
  if (!dl) return 'date-ok';
  const m = dl.toLowerCase();
  if (m.includes('avril') || m.includes('mars')) return 'date-urgente';
  if (m.includes('mai'))                          return 'date-proche';
  return 'date-ok';
}

// ── Toggle groupe ──────────────────────────────────────────────────────────────
function toggleGroupe(fid) {
  document.getElementById('grp-' + fid).classList.toggle('collapsed');
}

// ── Checkbox rapide ────────────────────────────────────────────────────────────
function toggleCheck(id, statutActuel) {
  const estContacte = ['Contacté','En attente','Réponse reçue','Dossier déposé','Admis'].includes(statutActuel);
  const newStatut   = estContacte ? 'À contacter' : 'Contacté';
  sauvegarderLocalement(id, newStatut, '');
  const idx = toutesEcoles.findIndex(e => e.id === id);
  if (idx !== -1) toutesEcoles[idx].statut = newStatut;
  filtrer();
  toast(newStatut === 'Contacté' ? '✅ Marqué comme contacté' : '○ Remis à "À contacter"');
}

// ── Sheet ──────────────────────────────────────────────────────────────────────
function ouvrirSheet(encoded) {
  const e = JSON.parse(decodeURIComponent(encoded));
  ecoleActive = e;

  document.getElementById('sh-nom').textContent = e.etablissement;
  document.getElementById('sh-sub').textContent = `${e.ville} · ${(e.formation || '').substring(0,55)}`;
  document.getElementById('sh-notes').value = e.notes || '';

  // Infos
  const tel = e.telephone || '';
  const fl  = FORM_LABELS[e.formation_id] || {};
  document.getElementById('sh-info').innerHTML = `
    ${e.universite ? `<div class="sh-row">🏛️ <span>${e.universite}</span></div>` : ''}
    <div class="sh-row">📍 <span>${e.ville}, ${e.region || ''}</span></div>
    ${tel ? `<div class="sh-row">📞 <a href="tel:${tel.replace(/\s/g,'')}">${tel}</a></div>` : ''}
    ${e.email_contact ? `<div class="sh-row">✉️ <a href="mailto:${e.email_contact}">${e.email_contact}</a></div>` : ''}
    ${e.date_limite ? `<div class="sh-row">📅 <span>Date limite : <strong>${e.date_limite}</strong></span></div>` : ''}
    ${e.lien_candidature ? `<div class="sh-row">🔗 <a href="${e.lien_candidature}" target="_blank">Lien candidature</a></div>` : ''}
  `;

  // Statut sélectionné
  document.querySelectorAll('.so').forEach(o => o.classList.toggle('sel', o.dataset.v === e.statut));

  document.getElementById('overlay').classList.add('open');
  document.body.style.overflow = 'hidden';
}

function fermer() {
  document.getElementById('overlay').classList.remove('open');
  document.body.style.overflow = '';
}

function selSt(el) {
  document.querySelectorAll('.so').forEach(o => o.classList.remove('sel'));
  el.classList.add('sel');
}

function sauvegarder() {
  if (!ecoleActive) return;
  const sel    = document.querySelector('.so.sel');
  const statut = sel ? sel.dataset.v : ecoleActive.statut;
  const notes  = document.getElementById('sh-notes').value;
  sauvegarderLocalement(ecoleActive.id, statut, notes);
  const idx = toutesEcoles.findIndex(e => e.id === ecoleActive.id);
  if (idx !== -1) { toutesEcoles[idx].statut = statut; toutesEcoles[idx].notes = notes; }
  fermer();
  filtrer();
  toast('💾 Statut enregistré');
}

function sauvegarderLocalement(id, statut, notes) {
  const u = JSON.parse(localStorage.getItem('ptp_local_updates') || '{}');
  u[id] = { statut, notes, date_derniere_action: new Date().toISOString() };
  localStorage.setItem('ptp_local_updates', JSON.stringify(u));
}

// ── Toast ──────────────────────────────────────────────────────────────────────
function toast(msg, d=2500) {
  const el = document.getElementById('toast');
  el.textContent = msg; el.classList.add('show');
  clearTimeout(el._t); el._t = setTimeout(() => el.classList.remove('show'), d);
}

// ── Init ───────────────────────────────────────────────────────────────────────
if ('serviceWorker' in navigator) navigator.serviceWorker.register('/sw.js').catch(()=>{});

sb.channel('ecoles-rt')
  .on('postgres_changes', {event:'*', schema:'public', table:'schools_tracking'}, chargerDonnees)
  .subscribe();

chargerDonnees();
</script>
</body>
</html>
