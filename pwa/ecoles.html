<style>
:root{
  --blue:#1F497D;--blue-l:#4472C4;--blue-pale:#EBF3FB;
  --green:#107c10;--green-bg:#dff0d8;
  --orange:#c07020;--orange-bg:#fff3cd;
  --red:#c00;--red-bg:#fce4d6;
  --purple:#6a0dad;--purple-bg:#f0e6ff;
  --grey:#6e6e73;--border:#e5e5ea;
  --card:#fff;--page:#f2f2f7;--text:#1c1c1e;--text2:#48484a;
  --safe-top:env(safe-area-inset-top,0px);
  --safe-bottom:env(safe-area-inset-bottom,20px);
}
@media(prefers-color-scheme:dark){:root{
  --card:#1c1c1e;--page:#000;--text:#fff;--text2:#aeaeb2;
  --border:#38383a;--blue-pale:#0a2040;
  --green-bg:#0a2a0a;--orange-bg:#2a1800;--red-bg:#2a0000;--purple-bg:#1a0a2a;
}}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{min-height:100%;background:var(--page);color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;font-size:15px}

/* Header */
.header{background:var(--blue);color:#fff;
  padding:calc(var(--safe-top)+14px) 16px 0;
  position:sticky;top:0;z-index:50}
.header-row{display:flex;align-items:center;gap:10px;padding-bottom:12px}
.header h1{font-size:1.1em;font-weight:700;flex:1}
.sync-btn{background:rgba(255,255,255,.2);border:none;color:#fff;
  padding:7px 13px;border-radius:12px;font-size:.82em;font-weight:600;cursor:pointer}

/* Toolbar */
.toolbar{background:var(--card);border-bottom:1px solid var(--border);
  padding:10px 16px;display:flex;gap:8px;align-items:center;
  position:sticky;top:52px;z-index:40}
.search-wrap{flex:1;position:relative}
.search-wrap input{width:100%;padding:8px 12px 8px 32px;
  border:1.5px solid var(--border);border-radius:10px;
  font-size:.88em;background:var(--page);color:var(--text);outline:none}
.search-wrap input:focus{border-color:var(--blue)}
.si{position:absolute;left:9px;top:50%;transform:translateY(-50%);
  opacity:.5;pointer-events:none}
.filter-sel{padding:8px 10px;border:1.5px solid var(--border);border-radius:10px;
  font-size:.82em;background:var(--page);color:var(--text);cursor:pointer;outline:none}

/* Contenu */
.scroll-content{padding-bottom:calc(var(--safe-bottom)+72px)}

/* Groupe formation */
.group{margin-bottom:2px}
.group-header{display:flex;align-items:center;gap:10px;
  padding:12px 16px;background:var(--card);border-bottom:1px solid var(--border);
  cursor:pointer;user-select:none;-webkit-user-select:none}
.group-header:active{background:var(--blue-pale)}
.group-prio{width:28px;height:28px;border-radius:8px;background:var(--blue);
  color:#fff;display:flex;align-items:center;justify-content:center;
  font-size:.78em;font-weight:700;flex-shrink:0}
.group-title{flex:1;font-size:.92em;font-weight:700}
.group-sub{font-size:.75em;color:var(--grey);font-weight:400;margin-top:1px}
.group-count{font-size:.78em;font-weight:700;color:var(--grey)}
.group-arrow{font-size:.9em;color:var(--grey);transition:transform .2s}
.group.collapsed .group-arrow{transform:rotate(-90deg)}
.group.collapsed .table-wrap{display:none}

/* Tableau */
.table-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch}
table{width:100%;border-collapse:collapse;min-width:540px}
thead th{padding:8px 12px;font-size:.76em;font-weight:700;color:var(--grey);
  text-align:left;background:var(--page);border-bottom:2px solid var(--border);
  white-space:nowrap}
tbody tr{border-bottom:1px solid var(--border);cursor:pointer;transition:background .1s}
tbody tr:hover{background:var(--blue-pale)}
td{padding:11px 12px;font-size:.85em;vertical-align:middle}

/* Checkbox */
.cb{width:24px;height:24px;border-radius:7px;border:2px solid var(--border);
  display:flex;align-items:center;justify-content:center;cursor:pointer;
  transition:all .15s;flex-shrink:0;margin:auto;font-size:13px;
  background:var(--card)}
.cb.checked{background:var(--green);border-color:var(--green);color:#fff}

.etab-name{font-weight:700;line-height:1.3}
.etab-univ{font-size:.77em;color:var(--grey);margin-top:1px}
.loc-city{font-weight:600}
.loc-reg{font-size:.77em;color:var(--grey);margin-top:1px}
.tel-link{white-space:nowrap;color:var(--blue);text-decoration:none;font-weight:500}

/* Date */
.date-chip{display:inline-block;padding:3px 9px;border-radius:8px;
  font-size:.76em;font-weight:700;white-space:nowrap}
.date-red{background:var(--red-bg);color:var(--red)}
.date-orange{background:var(--orange-bg);color:var(--orange)}
.date-green{background:var(--green-bg);color:var(--green)}

/* Badge statut */
.badge{display:inline-block;padding:3px 10px;border-radius:9px;
  font-size:.76em;font-weight:700;white-space:nowrap}
.b-todo{background:#e5e5ea;color:#555}
.b-brouillon{background:var(--orange-bg);color:var(--orange)}
.b-contacte{background:#d0f0ff;color:#006699}
.b-attente{background:var(--purple-bg);color:var(--purple)}
.b-reponse{background:var(--green-bg);color:var(--green)}
.b-admis{background:#c6efce;color:#276221}
.b-refuse{background:var(--red-bg);color:var(--red)}
.b-depose{background:#d0f0ff;color:#005588}

/* Actions */
.act-btn{display:inline-block;padding:6px 10px;border-radius:8px;border:none;
  font-size:.8em;font-weight:700;cursor:pointer;text-decoration:none;
  line-height:1}
.act-mail{background:var(--blue-pale);color:var(--blue)}
.act-tel{background:var(--green-bg);color:var(--green)}

/* Bottom sheet */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:200;
  display:none;align-items:flex-end}
.overlay.open{display:flex;animation:fi .2s}
@keyframes fi{from{opacity:0}to{opacity:1}}
.sheet{background:var(--card);border-radius:22px 22px 0 0;width:100%;
  max-height:88vh;overflow-y:auto;animation:su .25s ease}
@keyframes su{from{transform:translateY(100%)}to{transform:translateY(0)}}
.sh-handle{width:38px;height:4px;background:var(--border);border-radius:2px;margin:10px auto 0}
.sh-head{padding:14px 20px;border-bottom:1px solid var(--border)}
.sh-name{font-size:1.05em;font-weight:700}
.sh-sub{font-size:.82em;color:var(--grey);margin-top:3px}
.sh-body{padding:16px 20px}
.sh-lbl{font-size:.78em;font-weight:700;color:var(--grey);
  text-transform:uppercase;letter-spacing:.05em;margin:14px 0 8px}
.sh-lbl:first-child{margin-top:0}
.sh-row{display:flex;align-items:center;gap:8px;font-size:.88em;margin-bottom:6px}
.sh-row a{color:var(--blue);font-weight:600;text-decoration:none}
.status-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:14px}
.so{padding:10px;border-radius:12px;border:2px solid var(--border);
  text-align:center;font-size:.82em;font-weight:600;cursor:pointer;transition:all .15s}
.so.sel{border-color:var(--blue);background:var(--blue-pale);color:var(--blue)}
textarea.notes{width:100%;padding:12px;border:1.5px solid var(--border);
  border-radius:12px;font-size:.9em;font-family:inherit;
  background:var(--page);color:var(--text);resize:none;min-height:80px;
  outline:none;margin-bottom:14px}
textarea.notes:focus{border-color:var(--blue)}
.save-btn{width:100%;padding:14px;background:var(--blue);color:#fff;
  border:none;border-radius:14px;font-size:1em;font-weight:700;cursor:pointer}
.save-btn:active{opacity:.85}

/* Toast */
.toast{position:fixed;bottom:calc(var(--safe-bottom)+78px);left:50%;
  transform:translateX(-50%) translateY(8px);background:#222;color:#fff;
  padding:9px 18px;border-radius:12px;font-size:.84em;font-weight:500;
  z-index:300;opacity:0;transition:all .2s;pointer-events:none;white-space:nowrap}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

/* Bottom nav */
.bottom-nav{position:fixed;bottom:0;left:0;right:0;background:var(--card);
  border-top:1px solid var(--border);display:flex;padding:0 0 var(--safe-bottom);
  z-index:100;backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px)}
.nav-item{flex:1;display:flex;flex-direction:column;align-items:center;
  padding:10px 4px 6px;text-decoration:none;color:var(--grey);
  font-size:.65em;font-weight:500;gap:3px}
.nav-item.active{color:var(--blue)}
.nav-icon{font-size:1.55em}

/* Loading / empty */
.loading{text-align:center;padding:60px 20px;color:var(--grey)}
.spinner{width:34px;height:34px;border:3px solid var(--border);
  border-top-color:var(--blue);border-radius:50%;
  animation:sp .7s linear infinite;margin:0 auto 12px}
@keyframes sp{to{transform:rotate(360deg)}}
.empty{text-align:center;padding:40px 20px;color:var(--grey);font-size:.9em}
</style>
</head>

// ── State ─────────────────────────────────────────────────────────────────────
let ecoles = [];        // toutes les écoles (fusionnées)
let ecoleActive = null; // école ouverte dans la sheet

// ── Chargement ─────────────────────────────────────────────────────────────────
async function chargerDonnees() {
  document.getElementById('sync-btn').textContent = '⏳';
  try {
    const { data, error } = await sb
      .from('schools_tracking').select('*')
      .order('formation_priorite').order('etablissement');

    if (!error && data && data.length > 0) {
      // Enrichir avec téléphones depuis DATA_LOCAL si absents
      ecoles = data.map(row => {
        const loc = DATA_LOCAL.find(l => l.id === row.id);
        return { ...row, telephone: row.telephone || (loc && loc.telephone) || '' };
      });
      localStorage.setItem('ptp_ecoles_cache', JSON.stringify({ecoles, ts: Date.now()}));
    } else { throw 0; }
  } catch {
    const c = localStorage.getItem('ptp_ecoles_cache');
    ecoles = c ? JSON.parse(c).ecoles : DATA_LOCAL;
  }
  // Fusionner mises à jour locales
  const lu = JSON.parse(localStorage.getItem('ptp_local_updates') || '{}');
  ecoles = ecoles.map(e => ({ ...e, ...(lu[e.id] || {}) }));

  document.getElementById('loading').style.display = 'none';
  document.getElementById('sync-btn').textContent = '🔄 Sync';
  filtrer();
}

    if (!q) return true;
    return (e.etablissement + e.ville + (e.formation||'') + (e.telephone||''))
           .toLowerCase().includes(q);
  });
  render(filtered);
}

function render(liste) {
  const content = document.getElementById('content');
  const empty   = document.getElementById('empty');

  if (liste.length === 0) {
    content.style.display = 'none';
    empty.style.display   = 'block';
    return;
  }
  content.style.display = 'block';
  empty.style.display   = 'none';

  // Grouper par formation_id, trié par priorité
  const map = {};
  liste.forEach(e => {
    const fid = e.formation_id || 'autre';
    if (!map[fid]) map[fid] = { prio: e.formation_priorite || 99, rows: [] };
    map[fid].rows.push(e);
  });
  const groupes = Object.entries(map).sort((a,b) => a[1].prio - b[1].prio);

  content.innerHTML = groupes.map(([fid, g]) => {
    const fi   = FORM_INFO[fid] || { short: fid, nom: '', emoji: '🏫' };
    const nb   = g.rows.filter(e => estContacte(e.statut)).length;

    const lignes = g.rows.map(e => {
      const st     = e.statut || 'À contacter';
      const check  = estContacte(st);
      const dcls   = dateCls(e.date_limite);
      return `<tr data-id="${esc(e.id)}">
        <td><div class="cb${check?' checked':''}">
          ${check ? '✓' : ''}
        </div></td>
        <td>
          <div class="etab-name">${esc(e.etablissement)}</div>
          <div class="etab-univ">${esc(e.universite || e.region || '')}</div>
        </td>
        <td>
          <div class="loc-city">📍 ${esc(e.ville)}</div>
          <div class="loc-reg">${esc(e.region || '')}</div>
        </td>
        <td>${e.telephone
          ? `<a class="tel-link" href="tel:${e.telephone.replace(/\s/g,'')}"
               onclick="event.stopPropagation()">${esc(e.telephone)}</a>`
          : '<span style="color:var(--grey);font-size:.8em">—</span>'}</td>
        <td><span class="date-chip ${dcls}">${esc(e.date_limite || '—')}</span></td>
        <td><span class="badge ${BADGE[st]||'b-todo'}">${esc(st)}</span></td>
        <td>
          ${e.email_contact
            ? `<a class="act-btn act-mail"
                 href="mailto:${esc(e.email_contact)}?subject=Candidature%20LP%20PTP%202026"
                 onclick="event.stopPropagation()">✉️</a>` : ''}
          ${e.telephone
            ? `<a class="act-btn act-tel"
                 href="tel:${e.telephone.replace(/\s/g,'')}"
                 onclick="event.stopPropagation()">📞</a>` : ''}
        </td>
      </tr>`;
    }).join('');

    return `<div class="group" id="grp-${fid}">
      <div class="group-header" data-grp="${fid}">
        <div class="group-prio">${g.prio}</div>
        <div style="flex:1;min-width:0">
          <div class="group-title">${fi.emoji} ${fi.short}</div>
          <div class="group-sub">${fi.nom}</div>
        </div>
        <div class="group-count">${nb}/${g.rows.length}</div>
        <div class="group-arrow">▾</div>
      </div>
      <div class="table-wrap">
        <table>
          <thead><tr>
            <th style="width:40px">✓</th>
            <th>Établissement</th>
            <th>Localisation</th>
            <th>Téléphone</th>
            <th>Date limite</th>
            <th>Statut</th>
            <th>Actions</th>
          </tr></thead>
          <tbody>${lignes}</tbody>
        </table>
      </div>
    </div>`;
  }).join('');
}

function estContacte(st) {
  return ['Contacté','En attente','Réponse reçue','Dossier déposé','Admis'].includes(st);
}
function dateCls(dl) {
  if (!dl) return 'date-green';
  const m = dl.toLowerCase();
  if (m.includes('mars') || m.includes('avril')) return 'date-red';
  if (m.includes('mai'))  return 'date-orange';
  return 'date-green';
}
function esc(s) {
  return String(s||'')
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}

// ── Délégation d'événements (pas d'onclick inline) ─────────────────────────────
document.getElementById('content').addEventListener('click', e => {
  // Toggle groupe
  const grpBtn = e.target.closest('[data-grp]');
  if (grpBtn) {
    document.getElementById('grp-' + grpBtn.dataset.grp).classList.toggle('collapsed');
    return;
  }
  // Click sur la case à cocher
  const cb = e.target.closest('.cb');
  if (cb) {
    const tr = cb.closest('tr');
    if (tr) { toggleCheck(tr.dataset.id); return; }
  }
  // Click sur la ligne (ouvrir sheet)
  const tr = e.target.closest('tr[data-id]');
  if (tr) ouvrirSheet(tr.dataset.id);
});

document.getElementById('search').addEventListener('input', filtrer);
document.getElementById('filtre-statut').addEventListener('change', filtrer);
document.getElementById('sync-btn').addEventListener('click', chargerDonnees);

// ── Toggle case à cocher ────────────────────────────────────────────────────────
function toggleCheck(id) {
  const e       = ecoles.find(x => x.id === id);
  if (!e) return;
  const newSt   = estContacte(e.statut) ? 'À contacter' : 'Contacté';
  sauvegarderLocal(id, newSt, e.notes || '');
  e.statut = newSt;
  filtrer();
  toast(newSt === 'Contacté' ? '✅ Marqué contacté' : '○ Remis à contacter');
}

// ── Bottom sheet ───────────────────────────────────────────────────────────────
function ouvrirSheet(id) {
  const e = ecoles.find(x => x.id === id);
  if (!e) return;
  ecoleActive = e;

  document.getElementById('sh-nom').textContent = e.etablissement;
  document.getElementById('sh-sub').textContent = `${e.ville} · ${(e.formation||'').substring(0,55)}`;
  document.getElementById('sh-notes').value = e.notes || '';

  document.getElementById('sh-info').innerHTML = [
    e.universite  ? `<div class="sh-row">🏛️ <span>${esc(e.universite)}</span></div>`       : '',
    e.ville       ? `<div class="sh-row">📍 <span>${esc(e.ville)}, ${esc(e.region||'')}</span></div>` : '',
    e.telephone   ? `<div class="sh-row">📞 <a href="tel:${e.telephone.replace(/\s/g,'')}">${esc(e.telephone)}</a></div>` : '',
    e.email_contact ? `<div class="sh-row">✉️ <a href="mailto:${esc(e.email_contact)}">${esc(e.email_contact)}</a></div>` : '',
    e.date_limite ? `<div class="sh-row">📅 Date limite : <strong>${esc(e.date_limite)}</strong></div>` : '',
    e.lien_candidature ? `<div class="sh-row">🔗 <a href="${esc(e.lien_candidature)}" target="_blank">Lien candidature ↗</a></div>` : '',
  ].join('');

  document.querySelectorAll('.so').forEach(o =>
    o.classList.toggle('sel', o.dataset.v === e.statut)
  );

  document.getElementById('overlay').classList.add('open');
  document.body.style.overflow = 'hidden';
}

function fermerSheet() {
  document.getElementById('overlay').classList.remove('open');
  document.body.style.overflow = '';
}

// Clic overlay = fermer
document.getElementById('overlay').addEventListener('click', e => {
  if (e.target === document.getElementById('overlay')) fermerSheet();
});

// Sélection statut
document.querySelectorAll('.so').forEach(o =>
  o.addEventListener('click', () => {
    document.querySelectorAll('.so').forEach(x => x.classList.remove('sel'));
    o.classList.add('sel');
  })
);

// Sauvegarder
document.getElementById('save-btn').addEventListener('click', () => {
  if (!ecoleActive) return;
  const sel    = document.querySelector('.so.sel');
  const statut = sel ? sel.dataset.v : ecoleActive.statut;
  const notes  = document.getElementById('sh-notes').value;
  sauvegarderLocal(ecoleActive.id, statut, notes);
  ecoleActive.statut = statut;
  ecoleActive.notes  = notes;
  fermerSheet();
  filtrer();
  toast('💾 Statut enregistré');
});

// ── Persistance locale ─────────────────────────────────────────────────────────
function sauvegarderLocal(id, statut, notes) {
  const u = JSON.parse(localStorage.getItem('ptp_local_updates') || '{}');
  u[id] = { statut, notes, date_derniere_action: new Date().toISOString() };
  localStorage.setItem('ptp_local_updates', JSON.stringify(u));
}

// ── Toast ──────────────────────────────────────────────────────────────────────
function toast(msg, d = 2500) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(el._t);
  el._t = setTimeout(() => el.classList.remove('show'), d);
}

// ── Init ───────────────────────────────────────────────────────────────────────
if ('serviceWorker' in navigator) navigator.serviceWorker.register('/sw.js').catch(() => {});

sb.channel('ecoles-rt')
  .on('postgres_changes', { event: '*', schema: 'public', table: 'schools_tracking' }, chargerDonnees)
  .subscribe();

chargerDonnees();
</script>
</body>
</html>
