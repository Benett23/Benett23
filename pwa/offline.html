<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hors ligne — PTP</title>
<style>
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    background: #1F497D; color: white;
    display: flex; align-items: center; justify-content: center;
    min-height: 100vh; margin: 0; text-align: center; padding: 24px;
  }
  .card { max-width: 320px; }
  .icon { font-size: 4em; margin-bottom: 16px; }
  h1 { font-size: 1.4em; margin-bottom: 12px; }
  p { opacity: .8; font-size: .95em; line-height: 1.6; }
  button {
    margin-top: 24px; padding: 12px 28px; background: white;
    color: #1F497D; border: none; border-radius: 24px;
    font-size: 1em; font-weight: 700; cursor: pointer;
  }
</style>
</head>
<body>
  <div class="card">
    <div class="icon">📡</div>
    <h1>Pas de connexion</h1>
    <p>Les données affichées sont celles de votre dernière visite.<br>
    Reconnectez-vous pour voir les mises à jour en temps réel.</p>
    <button onclick="location.reload()">Réessayer</button>
  </div>
</body>
</html>
